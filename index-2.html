<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LISA Caption Generator</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#29242f 0%,#0c0b0e 42%,#050507 100%);
  color:#fff;
  padding:25px 15px;
}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:28px;
}

.logo{
  font-size:14px;
  letter-spacing:5px;
  color:#cfc7d8;
  margin-bottom:10px;
}

h1{
  font-size:clamp(28px,6vw,52px);
  letter-spacing:2px;
  font-weight:800;
}

.subtitle{
  margin-top:10px;
  color:#aaa;
  font-size:14px;
}

.card{
  background:rgba(20,18,23,.88);
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  backdrop-filter:blur(12px);
}

label{
  display:block;
  margin:15px 0 8px;
  font-size:13px;
  color:#cfcfcf;
}

input,
select{
  width:100%;
  padding:14px 15px;
  border-radius:12px;
  border:1px solid #38343d;
  background:#111015;
  color:white;
  outline:none;
  font-size:14px;
}

input:focus,
select:focus{
  border-color:#9d8aaa;
}

.generate{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:13px;
  cursor:pointer;
  font-weight:800;
  font-size:15px;
  color:#fff;
  background:linear-gradient(135deg,#76657f,#a28aab);
  transition:.2s;
}

.generate:hover{
  transform:translateY(-2px);
  filter:brightness(1.1);
}

.result{
  margin-top:20px;
  display:none;
}

.result-box{
  background:#0d0c10;
  border:1px solid #302c35;
  border-radius:15px;
  padding:18px;
  line-height:1.7;
  white-space:pre-wrap;
  font-size:15px;
}

.tags{
  margin-top:12px;
  color:#c9b5d0;
  line-height:1.7;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px;
}

button.secondary{
  padding:12px 8px;
  border:1px solid #39343f;
  border-radius:11px;
  background:#17151b;
  color:#fff;
  cursor:pointer;
  font-weight:700;
}

button.secondary:hover{
  background:#24202a;
}

.info{
  text-align:center;
  margin-top:16px;
  color:#777;
  font-size:11px;
}

.counter{
  text-align:center;
  margin-top:15px;
  color:#aaa;
  font-size:12px;
}

@media(max-width:600px){
  body{
    padding:15px 10px;
  }

  .card{
    padding:17px;
  }

  .buttons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">LISANESIA</div>

    <h1>LISA CAPTION GENERATOR</h1>

    <div class="subtitle">
      Caption generator khusus konten LISA
    </div>
  </div>

  <div class="card">

    <label for="event">Event / Momen</label>
    <input
      id="event"
      type="text"
      value="Louis Vuitton Fashion Show"
      placeholder="Contoh: Louis Vuitton Fashion Show"
    >

    <label for="name">Nama</label>
    <input
      id="name"
      type="text"
      value="LISA"
      placeholder="Contoh: LISA"
    >

    <label for="vibe">Pilih Gaya Caption</label>

    <select id="vibe">
      <option value="elegan">Elegan & Mewah</option>
      <option value="fashion">Fashion & Gaya</option>
      <option value="powerful">Powerful & Ikonik</option>
      <option value="hype">Hype & Support</option>
      <option value="short">Singkat & Clean</option>
    </select>

    <button class="generate" onclick="generateCaption()">
      ✨ GENERATE CAPTION
    </button>

    <div class="result" id="result">

      <div class="result-box" id="caption"></div>

      <div class="tags" id="tags">
        #LISAxLVSS27 #LISAxLouisVuitton
      </div>

      <div class="buttons">
        <button class="secondary" onclick="copyCaption()">
          COPY CAPTION
        </button>

        <button class="secondary" onclick="copyTags()">
          COPY TAGS
        </button>

        <button class="secondary" onclick="copyAll()">
          COPY ALL
        </button>
      </div>

      <div class="counter" id="counter"></div>

    </div>

  </div>

  <div class="info">
    Made for LILIES • LISA fan content
  </div>

</div>

/* =====================================================
   BUAT 100 VARIASI PER KATEGORI
===================================================== */

const captions = {};

const prefixes = [
  "",
  "Hari ini, ",
  "Sekali lagi, ",
  "Benar-benar, ",
  "Dan seperti biasa, ",
  "Tidak diragukan lagi, ",
  "Sekali lihat saja sudah jelas, ",
  "Malam ini, ",
  "Di momen ini, ",
  "Sekarang kita tahu bahwa ",
  "Jujur saja, ",
  "Harus diakui, ",
  "Satu hal yang pasti, ",
  "Seperti biasa, ",
  "Sulit untuk menyangkal bahwa ",
  "Semakin dilihat, semakin jelas bahwa ",
  "Momen ini kembali membuktikan bahwa ",
  "Tidak pernah gagal, ",
  "Yang paling menarik adalah ",
  "Dan sekali lagi kita melihat bahwa "
];

const endings = [
  "",
  " ✨",
  " 🤍",
  " 🖤",
  " 🔥",
  " 👑",
  " 💫",
  " ✨🤍",
  " 🖤✨",
  " 🔥✨",
  " 👑✨",
  " 💫🤍",
  " — benar-benar ikonik.",
  " — sebuah fashion moment yang luar biasa.",
  " — sulit untuk dilupakan.",
  " — benar-benar mencuri perhatian.",
  " — dan kita semua tahu alasannya.",
  " — LISA memang selalu punya caranya sendiri.",
  " — sekali lagi, sebuah momen yang luar biasa.",
  " — pantas mendapatkan semua perhatian."
];


Object.keys(captionData).forEach(category => {

  captions[category] = [];

  let base = captionData[category];

  for(let i = 0; i < base.length; i++){

    for(let j = 0; j < prefixes.length; j++){

      let text = prefixes[j] + base[i];

      /*
        Untuk mencegah kalimat seperti:
        "Hari ini, LISA..."
        menjadi aneh pada caption yang sudah dimulai
        dengan kata tertentu.
      */

      if(j === 0){
        text = base[i];
      }

      let ending = endings[(i + j) % endings.length];

      let finalText = text + ending;

      if(!captions[category].includes(finalText)){
        captions[category].push(finalText);
      }

      if(captions[category].length >= 100){
        break;
      }
    }

    if(captions[category].length >= 100){
      break;
    }
  }

});


/* =====================================================
   SISTEM ANTI REPEAT
===================================================== */

const usedIndexes = {
  elegan: new Set(),
  fashion: new Set(),
  powerful: new Set(),
  hype: new Set(),
  short: new Set()
};


/* =====================================================
   GENERATE CAPTION
===================================================== */

function generateCaption(){

  const category = document.getElementById("vibe").value;

  const name =
    document.getElementById("name").value.trim() || "LISA";

  const event =
    document.getElementById("event").value.trim() ||
    "Louis Vuitton Fashion Show";


  /*
    Kalau semua caption kategori sudah dipakai,
    reset supaya bisa mulai lagi.
  */

  if(usedIndexes[category].size >= captions[category].length){
    usedIndexes[category].clear();
  }


  let randomIndex;

  do{

    randomIndex =
      Math.floor(Math.random() * captions[category].length);

  }while(usedIndexes[category].has(randomIndex));


  usedIndexes[category].add(randomIndex);


  let selected =
    captions[category][randomIndex];


  /*
    Ganti nama dan event kalau user mengubah input.
  */

  selected =
    selected.replaceAll("LISA", name);

  selected =
    selected.replaceAll(
      "Louis Vuitton Fashion Show",
      event
    );


  document.getElementById("caption").textContent =
    selected;


  document.getElementById("tags").textContent =
    "#LISAxLVSS27 #LISAxLouisVuitton";


  document.getElementById("result").style.display =
    "block";


  document.getElementById("counter").textContent =
    `Caption ${usedIndexes[category].size} / ${captions[category].length} digunakan dalam kategori ini`;

}


/* =====================================================
   COPY CAPTION
===================================================== */

function copyCaption(){

  const text =
    document.getElementById("caption").textContent;

  navigator.clipboard.writeText(text)
    .then(() => {

      alert("Caption berhasil disalin! 🔥");

    });

}


/* =====================================================
   COPY TAGS
===================================================== */

function copyTags(){

  const tags =
    "#LISAxLVSS27 #LISAxLouisVuitton";

  navigator.clipboard.writeText(tags)
    .then(() => {

      alert("Hashtag berhasil disalin! 🔥");

    });

}


/* =====================================================
   COPY ALL
===================================================== */

function copyAll(){

  const caption =
    document.getElementById("caption").textContent;

  const tags =
    "#LISAxLVSS27 #LISAxLouisVuitton";


  const all =
    caption + "\n\n" + tags;


  navigator.clipboard.writeText(all)
    .then(() => {

      alert("Caption + hashtag berhasil disalin! 🔥");

    });

}


/* =====================================================
   ENTER = GENERATE
===================================================== */

document.addEventListener("keydown", function(e){

  if(e.key === "Enter"){

    const active =
      document.activeElement.tagName;

    if(active === "INPUT" || active === "SELECT"){
      generateCaption();
    }

  }

});

</script>
