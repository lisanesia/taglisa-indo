.card{

  border-radius:22px;

label{

  color:#aaa;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1.5px;

input,

  margin-bottom:18px;

}

input:focus,
select:focus{

}

button{
  border:0;
  border-radius:12px;
  padding:14px;
  cursor:pointer;
  font-weight:800;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
}

.generate{
  width:100%;
  background:#eee;
  color:#050505;
  font-size:15px;
}

.result{
  display:none;
  margin-top:25px;
}

.title{
  color:#aaa;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1.5px;
  margin:18px 0 8px;
}

.box{
  background:#080808;
  border:1px solid #333;
  border-radius:15px;
  padding:18px;
  line-height:1.75;
  white-space:pre-line;
  font-size:15px;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.buttons button{
  flex:1;
  background:#272727;
  color:white;
  border:1px solid #444;
}

.buttons .copy{
  background:#eee;
  color:#050505;
}

.counter{
  text-align:center;
  color:#666;
  font-size:11px;
  margin-top:14px;
}

footer{
  text-align:center;
  color:#555;
  font-size:10px;
  letter-spacing:2px;
  margin-top:25px;
}

@media(max-width:600px){
  .card{
    padding:18px;
  }

  .buttons{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<label>Nama</label>

<input

<label>Kategori</label>

<select id="category">

<option value="short">

<div

CAPTION
</div>

<div

></div>


<div class="title">
HASHTAG
</div>

<div class="box">
#LISAxLVSS27

<div class="buttons">

<button onclick="generateCaption()">

</div>


<div

</div>

</div>

/* =====================================================
   MEMBUAT 100 CAPTION PER KATEGORI
   DARI 20 BASE CAPTION
===================================================== */

function buildCaptions(base, event, name){

  const result=[];

  const endings=[
    "✨",
    "🖤",
    "🔥",
    "Benar-benar tak terlupakan.",
    "Satu lagi momen ikonik.",
  ];

  for(let i=0;i<base.length;i++){

    for(let j=0;j<5;j++){

      let caption =
        base[i]
        .replaceAll("LISA",name)
        + " " + endings[j];

      result.push(caption);

    }

  }

  return result.slice(0,100);
}


/* =====================================================
   ANTI REPEAT
===================================================== */

const used = {
  elegan:[],
  fashion:[],
  powerful:[],
  hype:[],
  short:[]
};


let currentCaption="";


function generateCaption(){

  const category =
    document.getElementById("category").value;

  const event =
    document.getElementById("event").value.trim()
    || "Louis Vuitton Fashion Show";

  const name =
    document.getElementById("name").value.trim()
    || "LISA";


  const captions =
    buildCaptions(
      database[category],
      event,
      name
    );


  /* RESET SETELAH 100 CAPTION HABIS */

  if(
    used[category].length >= captions.length
  ){

    used[category]=[];

  }


  let index;


  do{

    index =
      Math.floor(
        Math.random()*captions.length
      );

  }while(
    used[category].includes(index)
  );


  used[category].push(index);


  currentCaption =
    captions[index]
    + "\n\n"
    + hashtags();


  document.getElementById("caption")
    .textContent =
    captions[index];


  document.getElementById("result")
    .style.display="block";


  document.getElementById("counter")
    .textContent =
    "Caption terpakai: "
    + used[category].length
    + " / 100";

}


/* =====================================================
   HASHTAG
===================================================== */

function hashtags(){

  return "#LISAxLVSS27 #LISAxLouisVuitton";

}


/* =====================================================
   COPY
===================================================== */

function copyAll(){

  if(!currentCaption){
    return;
  }

  navigator.clipboard.writeText(
    currentCaption
  )
  .then(()=>{

    alert(
      "Berhasil disalin! ✨"
    );

  })
  .catch(()=>{

    const textarea =
      document.createElement("textarea");

    textarea.value=currentCaption;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand("copy");

    textarea.remove();

    alert(
      "Berhasil disalin! ✨"
    );

  });

}
